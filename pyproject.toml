[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neyvro"
version = "0.1.0"
description = "Tenant-aware foundation for the Neyvro intelligence platform"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0", "mcp>=1.0.0", "PyJWT[crypto]>=2.8.0", "httpx>=0.28.0", "uvicorn>=0.30,<1"]

[project.scripts]
neyvro-skills = "neyvro.skill_cli:main"
neyvro-mcp-skills = "neyvro.mcp_server:main"
neyvro-mcp-remote = "neyvro.remote_mcp:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
